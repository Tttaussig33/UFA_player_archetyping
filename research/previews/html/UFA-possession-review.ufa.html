</style></head><body><main id="ufa-report"></main><script>/* Portable display adapter for the three UFA reports. No external resources. */
(() => {
  'use strict';
  const SVG = 'http://www.w3.org/2000/svg';
  const svgTags = new Set(['svg', 'g', 'rect', 'line', 'circle', 'text', 'title', 'path', 'polygon', 'polyline', 'ellipse']);
  const unitless = new Set(['opacity', 'fontWeight', 'lineHeight', 'flex', 'flexGrow', 'flexShrink', 'order', 'zIndex']);
  const theme = {
    text: {primary:'var(--report-text)', secondary:'var(--report-muted)', tertiary:'var(--report-muted)', link:'var(--report-accent)'},
    accent: {primary:'var(--report-accent)'},
    stroke: {tertiary:'var(--report-border)'}
  };
  let app, cursor = 0, scheduled = false;
  const states = [], cleanups = [], mounted = [];
  const host = typeof acquireVsCodeApi === 'function' ? acquireVsCodeApi() : null;

  function append(node, children) {
    for (const child of children.flat(Infinity)) {
      if (child == null || typeof child === 'boolean') continue;
      node.appendChild(child instanceof Node ? child : document.createTextNode(String(child)));
    }
  }

  function h(tag, props, ...children) {

    const svg = svgTags.has(tag);
    const el = svg ? document.createElementNS(SVG, tag) : document.createElement(tag);
    for (const [key, value] of Object.entries(props)) {
      if (key === 'key' || key === 'children' || value == null) continue;
      if (key === 'style') {
        for (const [name, setting] of Object.entries(value)) {
          el.style[name] = typeof setting === 'number' && !unitless.has(name) ? setting + 'px' : setting;
        }
      } else if (/^on[A-Z]/.test(key)) {
        el.addEventListener(key.slice(2).toLowerCase(), value);
      } else if (key === 'className') {
        el.setAttribute('class', value);
      } else if (typeof value === 'boolean') {
        if (value) el.setAttribute(key, '');
      } else {
        const name = svg && !['viewBox', 'preserveAspectRatio'].includes(key)
          ? key.replace(/[A-Z]/g, c => '-' + c.toLowerCase()) : key;
        el.setAttribute(name, value);
      }
    }
    append(el, children);
    return el;
  }

  const Grid = ({columns, gap = 16, style, children}) => h('div', {className:'ufa-grid', style:{gridTemplateColumns:columns, gap, ...style}}, children);
  const H1 = ({children, style}) => h('h1', {style}, children);
  const H2 = ({children, style}) => h('h2', {style}, children);

    className:[size === 'small' ? 'ufa-small' : '', tone === 'secondary' ? 'ufa-secondary' : ''].join(' '),

          : h('text', {x:center, y:height - 14, textAnchor:'middle'}, category));

          const offset = center - (barSize * series.length) / 2 + j * barSize;
          const rect = horizontal

          rect.setAttribute('data-category', String(category));
          rect.setAttribute('data-series', s.name);
          rect.appendChild(h('title', {}, `${category} · ${s.name}: ${format(value)}`));
          svg.appendChild(rect);
          if (showValues) svg.appendChild(horizontal
            ? h('text', {x:x(value) + (value >= 0 ? 6 : -6), y:offset + barSize / 2 + 3, textAnchor:value >= 0 ? 'start' : 'end'}, format(value))

    }

      draw();
      const observer = new ResizeObserver(draw);
      observer.observe(container);
      cleanups.push(() => observer.disconnect());
    });
    return container;
  }

  function paint() {
    cleanups.splice(0).forEach(fn => fn());
    cursor = 0;
    const selectedIndex = Array.from(document.querySelectorAll('select')).indexOf(document.activeElement);
    const openDetails = Array.from(document.querySelectorAll('details')).map(el => el.open);
    const root = document.getElementById('ufa-report');
    root.replaceChildren(h(app, {}));
    mounted.splice(0).forEach(fn => fn());
    document.querySelectorAll('details').forEach((el, i) => { if (openDetails[i]) el.open = true; });
    if (selectedIndex >= 0) document.querySelectorAll('select')[selectedIndex]?.focus({preventScroll:true});
    document.title = document.querySelector('h1')?.textContent || document.title;
    host?.postMessage({
      type:'ufa-preview-ready', title:document.title,
      tableRows:Array.from(document.querySelectorAll('tbody')).map(el => el.rows.length),
      chartCount:document.querySelectorAll('svg').length,
      selectors:Array.from(document.querySelectorAll('select')).map(el => el.value)
    });
  }

  window.UFAPreview = {h, Stack, Grid, H1, H2, Text, Select, Table, BarChart,
    useState, useHostTheme:() => theme, render:component => { app = component; paint(); }};
})();

    }
    return h(Stack, { gap: 14 },
        h(H1, null, "Review these possessions"),
        h(Text, null, "Atlanta at Houston \u00B7 April 24, 2026. Five selected examples to discuss opening passes and play after regaining the disc."),
        h("label", { style: { display: "grid", gap: 6 } },
            h("span", { style: { color: muted, fontSize: 13 } }, "Choose a recorded possession"),
            h(Select, { value: caseId, onChange: value => { setCaseId(value); setFocus("1"); }, options: DATA.cases.map(c => ({ value: c.id, label: c.id + " · " + c.title })) })),
        h(H2, null,
            item.id,
            " \u00B7 ",
            item.title),
        h(Text, null,
            item.team,
            " \u00B7 Q",
            item.quarter,
            ", point ",
            item.point,
            " \u00B7 Team possession ",
            item.ownPossession,
            " \u00B7 ",
            item.throws.length,
            " throws \u00B7 Ends in ",
            outcome.toLowerCase()),
        h(Text, { size: "small", tone: "secondary" },
            item.start,
            ". Every recorded physical throw is retained; no centering pass has been removed."),
        h("div", { style: { display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(min(100%, 320px), 1fr))", gap: 24, alignItems: "start" } },
            h("section", null,
                h("label", { style: { display: "grid", gap: 6 } },
                    h("span", { style: { color: muted, fontSize: 13 } }, "Highlight a throw"),
                    h(Select, { value: focus, onChange: setFocus, options: [{ value: "all", label: "All throws" }, ...item.throws.map(t => ({ value: String(t.n), label: `Throw ${t.n} · ${t.outcome}${t.huck ? " · Huck" : ""}` }))] })),
                h("svg", { viewBox: "0 0 390 710", style: { width: "100%", maxHeight: 590 }, role: "img", "aria-label": `Recorded throwing locations for case ${item.id}. Attacking upward. Horizontal coordinates are yards from the centerline; vertical coordinates are yards from the back of the defended end zone.` },
                    h("title", null,
                        "Recorded throw locations \u00B7 ",
                        item.team,
                        " \u00B7 Q",
                        item.quarter,
                        ", point ",
                        item.point),
                    h("rect", { x: 60, y: 50, width: 266.667, height: 600, fill: "none", stroke: muted }),
                    h("rect", { x: 60, y: 50, width: 266.667, height: 100, fill: accent, opacity: 0.06 }),
                    h("rect", { x: 60, y: 550, width: 266.667, height: 100, fill: accent, opacity: 0.06 }),
                    [0, 20, 40, 60, 80, 100, 120].map(y => h("g", { key: y },
                        h("line", { x1: 60, x2: 326.667, y1: sy(y), y2: sy(y), stroke: y === 20 || y === 100 ? muted : border }),
                        h("text", { x: 49, y: sy(y) + 5, textAnchor: "end", fontSize: 13, fill: muted }, y))),
                    h("line", { x1: sx(0), x2: sx(0), y1: 50, y2: 650, stroke: border, strokeDasharray: "4 5" }),
                    h("text", { x: 193, y: 24, textAnchor: "middle", fill: theme.text.primary, fontSize: 14 }, "Attack \u2191 \u00B7 goal line at 100 yd"),
                    h("text", { transform: "translate(15 350) rotate(-90)", textAnchor: "middle", fontSize: 12, fill: muted }, "Yards from defended back line"),
                    h("text", { x: 193, y: 700, textAnchor: "middle", fontSize: 12, fill: muted }, "Yards from centerline"),
                    [-20, 0, 20].map(x => h("text", { key: x, x: sx(x), y: 674, textAnchor: "middle", fill: muted, fontSize: 13 }, x)),
                    item.id === "B" && h("g", null,
                        h("circle", { cx: sx(0), cy: sy(40), r: 6, fill: "none", stroke: muted }),
                        h("text", { x: sx(0) + 10, y: sy(40) + 18, fill: muted, fontSize: 12 }, "Brick location")),
                    item.throws.filter(t => !selected || t.n !== selected.n).map(arrow),
                    selected && arrow(selected)),
                h(Text, { size: "small", tone: "secondary" }, "Solid: completed pass. Dashed: incomplete attempt. Arrows connect recorded start and endpoint; they do not show flight paths or player movement.")),
            h("section", null,
                h(Text, { weight: "semibold" }, item.prompt),
                h(Text, null, selected ? `Throw ${selected.n}: ${selected.from} → ${selected.to}. ${selected.outcome}${selected.huck ? " · Huck" : ""}.` : "All recorded throws are shown."),
                h(Table, { headers: ["Throw", "Thrower → receiver / target", "Result"], rows: item.throws.map(t => [String(t.n), t.from + " → " + t.to, t.outcome + (t.huck ? " · Huck" : "")]), columnAlign: ["right", "left", "left"] }),
                penalties.length > 0 && h(Text, { size: "small", tone: "secondary" },
                    "Recorded penalty before throw",
                    penalties.length > 1 ? "s" : "",
                    " ",
                    penalties.map(t => t.n).join(", "),
                    ". Any awarded movement is not counted as a throw."),
                h(Text, { size: "small", tone: "secondary" },
                    "ShownSpace locator: Play-by-Play \u2192 ",
                    item.sourceCue,
                    ". The site's possession numbering includes both teams; our team possession number counts only the receiving team's turns with the disc."),
                h("a", { href: DATA.url, target: "_blank", rel: "noreferrer", style: { color: theme.text.link } }, "Open the original game in ShownSpace"))),
        h("details", { style: { borderTop: "1px solid " + border, paddingTop: 12 } },
            h("summary", { style: { cursor: "pointer", color: muted } }, "Sources and limits"),
            h(Text, { size: "small" }, DATA.source),
            h(Text, { size: "small" }, DATA.selection),
            h(Text, { size: "small" }, "Huck labels use the existing study rule: more than 40 yards in straight-line distance and more than 30 yards toward the attacking end zone. These labels do not establish throw difficulty or receiver openness."),
            h(Text, { size: "small" }, "A brick location plus an out-of-bounds pull is compatible with a brick restart; the raw record has no explicit brick-choice field. An in-bounds flag does not identify whether the pull was caught or picked up."),
            h(Text, { size: "small" },
                "Source event indices (",
                item.sourceSide,
                "): ",
                item.throws.map(t => t.sourceIndex).join(", "),
                ". Point-start index: ",
                item.pointStartIndex,
                ". These are data-based reconstructions, not film-reviewed tactical labels.")));
}

window.UFAPreview.render(PossessionReview); })();</script></body></html>
